<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Music Subscription 🎵</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top left,
            rgba(29, 209, 161, 0.25),
            transparent 35%
          ),
          linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        display: flex;
        flex-direction: column;
      }

      h1 {
        text-align: center;
        margin: 20px 0;
        font-size: 42px;
      }

      .container {
        flex: 1;
        width: 100%;
        max-width: 950px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #home,
      #login,
      #register,
      #main {
        width: 100%;
        background: rgba(255, 255, 255, 0.12);
        padding: 38px;
        border-radius: 24px;
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.4);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.18);
        margin-bottom: 20px;
      }

      .hidden {
        display: none;
      }

      h2 {
        margin-bottom: 22px;
      }

      h3 {
        margin: 30px 0 18px;
        color: #1dd1a1;
      }

      input {
        padding: 14px;
        margin: 9px;
        width: 220px;
        border: none;
        border-radius: 12px;
        outline: none;
      }

      button {
        padding: 13px 22px;
        margin: 9px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #1dd1a1, #10ac84);
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      #results,
      #subscriptions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 22px;
        margin-top: 22px;
      }

      .card {
        background: rgba(255, 255, 255, 0.16);
        padding: 18px;
        border-radius: 18px;
      }

      img {
        width: 125px;
        height: 125px;
        object-fit: cover;
        border-radius: 16px;
        margin-bottom: 12px;
      }

      #userName {
        color: #1dd1a1;
      }
    </style>
  </head>

  <body>
    <h1>Music Subscription 🎵</h1>

    <!-- HOME -->
    <div id="home">
      <button onclick="showLogin()">Login</button>
      <button onclick="showRegister()">Register</button>
    </div>

    <!-- LOGIN -->
    <div id="login" class="hidden">
      <h2>Login</h2>
      <button onclick="goHome()">Home</button><br /><br />

      <form id="loginForm">
        <input id="loginEmail" placeholder="Email" /><br /><br />
        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
        /><br /><br />
        <button type="submit">Login</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div id="register" class="hidden">
      <h2>Register</h2>
      <button onclick="goHome()">Home</button><br /><br />

      <form id="registerForm">
        <input id="name" placeholder="Name" /><br /><br />
        <input id="email" placeholder="Email" /><br /><br />
        <input
          id="password"
          type="password"
          placeholder="Password"
        /><br /><br />
        <button type="submit">Register</button>
      </form>
    </div>

    <!-- MAIN -->
    <div id="main" class="hidden">
      <h2>Welcome <span id="userName"></span></h2>
      <button onclick="logout()">Logout</button>

      <h3>Search Songs</h3>
      <form id="songForm">
        <input id="title" placeholder="Title" />
        <input id="artist" placeholder="Artist" />
        <input id="album" placeholder="Album" />
        <input id="year" placeholder="Year" />
        <button type="submit">Search</button>
      </form>

      <div id="results"></div>

      <h3>Your Subscriptions</h3>
      <div id="subscriptions"></div>
    </div>

    <script>
      const BASE_URL =
        "https://cqj3th6g52.execute-api.us-east-1.amazonaws.com/default";

      let userEmail = localStorage.getItem("email");
      let userName = localStorage.getItem("name");

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      // AUTO LOGIN
      if (userEmail && userName) {
        document.getElementById("userName").innerText = userName;
        showMain();
        loadSubscriptions();
      }

      function showLogin() {
        hideAll();
        login.classList.remove("hidden");
      }

      function showRegister() {
        hideAll();
        register.classList.remove("hidden");
      }

      function showMain() {
        hideAll();
        main.classList.remove("hidden");
      }

      function goHome() {
        hideAll();
        home.classList.remove("hidden");
      }

      function hideAll() {
        ["home", "login", "register", "main"].forEach((id) =>
          document.getElementById(id).classList.add("hidden"),
        );
      }

      // REGISTER
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        if (!nameInput.value.trim()) return alert("Name is required");
        if (!emailInput.value.trim()) return alert("Email is required");
        if (!passwordInput.value.trim()) return alert("Password is required");

        if (!isValidEmail(emailInput.value))
          return alert("Invalid email format (e.g. abc@gmail.com)");

        try {
          const res = await fetch(`${BASE_URL}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: nameInput.value,
              email: emailInput.value,
              password: passwordInput.value,
            }),
          });

          const data = await res.json();

          if (res.ok) {
            alert("Registered!");
            showLogin();
          } else {
            alert(data.message || "Register failed");
          }
        } catch (err) {
          console.error(err);
          alert("Server error");
        }
      });
      // LOGIN
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!loginEmail.value.trim()) return alert("Email is required");
        if (!loginPassword.value.trim()) return alert("Password is required");

        if (!isValidEmail(loginEmail.value))
          return alert("Invalid email format");

        try {
          const res = await fetch(`${BASE_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: loginEmail.value,
              password: loginPassword.value,
            }),
          });

          const data = await res.json();

          if (res.ok) {
            localStorage.setItem("email", data.user.email);
            localStorage.setItem("name", data.user.name);

            userEmail = data.user.email;
            userName = data.user.name;

            document.getElementById("userName").innerText = userName;

            showMain();
            loadSubscriptions();
          } else alert(data.message);
        } catch {
          alert("Login error");
        }
      });

      // SEARCH
      songForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!title.value && !artist.value && !album.value && !year.value)
          return alert("Enter at least one field");

        try {
          const res = await fetch(
            `${BASE_URL}/songs?title=${title.value}&artist=${artist.value}&album=${album.value}&year=${year.value}`,
          );
          const data = await res.json();

          results.innerHTML = "";

          if (!data.length) return (results.innerHTML = "<p>No result</p>");

          data.forEach((song) => {
            results.innerHTML += `
        <div class="card">
          <img src="${song.image_url}">
          <p><b>${song.title}</b></p>
          <p>${song.artist}</p>
          <button onclick="subscribe('${song.title}')">Subscribe</button>
        </div>`;
          });
        } catch {
          results.innerHTML = "<p>Error loading songs</p>";
        }
      });

      // SUBSCRIBE
      async function subscribe(title) {
        try {
          const res = await fetch(`${BASE_URL}/subscribe`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, title }),
          });

          const data = await res.json();

          if (!res.ok) return alert(data.message);

          loadSubscriptions();
        } catch {
          alert("Error subscribing");
        }
      }

      // LOAD SUBSCRIPTIONS
      async function loadSubscriptions() {
        try {
          const res = await fetch(
            `${BASE_URL}/subscriptions?email=${userEmail}`,
          );
          const data = await res.json();

          subscriptions.innerHTML = "";

          if (!data.length)
            return (subscriptions.innerHTML = "<p>No subscriptions</p>");

          data.forEach((song) => {
            subscriptions.innerHTML += `
        <div class="card">
          <img src="${song.image_url}">
          <p><b>${song.title}</b></p>
          <p>${song.artist}</p>
          <button onclick="unsubscribe('${song.title}')">Remove</button>
        </div>`;
          });
        } catch {
          subscriptions.innerHTML = "<p>Error loading</p>";
        }
      }

      // UNSUBSCRIBE
      async function unsubscribe(title) {
        try {
          await fetch(`${BASE_URL}/subscribe`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, title }),
          });

          loadSubscriptions();
        } catch {
          alert("Error removing");
        }
      }

      // LOGOUT
      function logout() {
        localStorage.clear();
        showLogin();
      }
    </script>
  </body>
</html>
